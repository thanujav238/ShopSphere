<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Wishlist | ShopSphere</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet"
        href="style.css">


    <style>

        /* =====================================================
           WISHLIST PAGE
        ===================================================== */

        .wishlist-page {
            min-height: 100vh;

            padding: 55px 25px 80px;

            background: #08090d;

            color: #f5f5f7;
        }

        .wishlist-container {
            width: min(1200px, 100%);
            margin: auto;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .wishlist-header {
            width: min(1200px, 100%);
            margin: 0 auto 40px;
        }

        .wishlist-label {
            display: inline-block;

            margin-bottom: 12px;

            color: #a78bfa;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .wishlist-header-row {
            display: flex;
            justify-content: space-between;
            align-items: end;

            gap: 25px;
        }

        .wishlist-header h1 {
            margin: 0 0 8px;

            color: #ffffff;

            font-size: clamp(30px, 4vw, 42px);
            font-weight: 800;

            line-height: 1.1;
        }

        .wishlist-header p {
            margin: 0;

            color: #8f929f;

            font-size: 14px;
        }

        .wishlist-count {
            padding: 9px 14px;

            border: 1px solid #2a2c36;
            border-radius: 30px;

            background: #11131a;

            color: #b9bac3;

            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }


        /* =====================================================
           WISHLIST GRID
        ===================================================== */

        #wishlist-container {
            width: min(1200px, 100%);
            margin: auto;
        }

        .wishlist-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 20px;
        }


        /* =====================================================
           PRODUCT CARD
        ===================================================== */

        .wishlist-card {
            position: relative;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            min-width: 0;

            background: #11131a;

            border: 1px solid #242631;

            border-radius: 18px;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .wishlist-card:hover {
            transform: translateY(-5px);

            border-color: #3a354d;

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.3);
        }


        /* =====================================================
           PRODUCT IMAGE
        ===================================================== */

        .wishlist-image {
            position: relative;

            width: 100%;
            height: 220px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #191b24,
                    #101117
                );

            border-bottom: 1px solid #242631;
        }

        .wishlist-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            transition: transform 0.35s ease;
        }

        .wishlist-card:hover
        .wishlist-image img {
            transform: scale(1.04);
        }

        .wishlist-image-placeholder {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                rgba(139, 92, 246, 0.1);

            color: #a78bfa;

            font-size: 26px;
        }


        /* =====================================================
           REMOVE BUTTON
        ===================================================== */

        .wishlist-remove {
            position: absolute;

            top: 13px;
            right: 13px;

            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;

            background: rgba(8, 9, 13, 0.82);

            color: #ff7b8a;

            backdrop-filter: blur(8px);

            cursor: pointer;

            transition: 0.2s ease;
        }

        .wishlist-remove:hover {
            background: #ff4d61;

            color: #ffffff;

            transform: scale(1.08);
        }


        /* =====================================================
           PRODUCT INFO
        ===================================================== */

        .wishlist-info {
            display: flex;
            flex-direction: column;

            padding: 20px 19px 15px;

            flex: 1;
        }

        .wishlist-brand {
            margin-bottom: 8px;

            color: #8f7be8;

            font-size: 11px;
            font-weight: 750;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .wishlist-info h3 {
            margin: 0 0 9px;

            color: #ffffff !important;

            font-size: 16px;
            font-weight: 700;

            line-height: 1.4;
        }

        .wishlist-price {
            margin-top: auto;

            color: #ffffff !important;

            font-size: 20px;
            font-weight: 800;
        }


        /* =====================================================
           CARD ACTIONS
        ===================================================== */

        .wishlist-actions {
            display: grid;

            grid-template-columns: 1fr;

            gap: 9px;

            padding: 0 19px 19px;
        }

        .wishlist-cart-btn {
            width: 100%;

            padding: 12px 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            border: none;
            border-radius: 10px;

            background: #8b5cf6;

            color: #ffffff;

            font-size: 13px;
            font-weight: 750;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .wishlist-cart-btn:hover {
            background: #7c4de6;

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(139, 92, 246, 0.2);
        }

        .wishlist-delete-btn {
            width: 100%;

            padding: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            border: 1px solid #2c2e38;
            border-radius: 10px;

            background: transparent;

            color: #8e909b;

            font-size: 12px;
            font-weight: 650;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .wishlist-delete-btn:hover {
            border-color: #4a2b32;

            background: rgba(255, 77, 97, 0.06);

            color: #ff7b8a;
        }


        /* =====================================================
           LOADING
        ===================================================== */

        .wishlist-loading {
            min-height: 300px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 13px;

            color: #858894;

            font-size: 13px;
        }

        .wishlist-loading i {
            color: #a78bfa;

            font-size: 22px;
        }


        /* =====================================================
           EMPTY WISHLIST
        ===================================================== */

        .empty-wishlist {
            min-height: 430px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 45px 25px;

            text-align: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(139, 92, 246, 0.08),
                    transparent 50%
                ),
                #11131a;

            border: 1px solid #242631;

            border-radius: 20px;
        }

        .empty-wishlist-icon {
            width: 80px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 22px;

            border-radius: 22px;

            background: rgba(139, 92, 246, 0.1);

            color: #a78bfa;

            font-size: 31px;
        }

        .empty-wishlist h3 {
            margin: 0 0 9px;

            color: #ffffff;

            font-size: 21px;
        }

        .empty-wishlist p {
            max-width: 400px;

            margin: 0 0 24px;

            color: #858894;

            font-size: 13px;

            line-height: 1.6;
        }

        .empty-wishlist a {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            padding: 12px 20px;

            border-radius: 10px;

            background: #8b5cf6;

            color: #ffffff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 750;

            transition: 0.2s ease;
        }

        .empty-wishlist a:hover {
            background: #7c4de6;

            transform: translateY(-2px);
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .wishlist-error {
            min-height: 300px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            background: #11131a;

            border: 1px solid #292b35;

            border-radius: 18px;
        }

        .wishlist-error > i {
            margin-bottom: 15px;

            color: #ff7b8a;

            font-size: 30px;
        }

        .wishlist-error h3 {
            margin: 0 0 7px;

            color: #ffffff;

            font-size: 19px;
        }

        .wishlist-error p {
            margin: 0;

            color: #858894;

            font-size: 13px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1050px) {

            .wishlist-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }


        @media (max-width: 760px) {

            .wishlist-page {
                padding: 40px 16px 60px;
            }

            .wishlist-header-row {
                align-items: flex-start;

                flex-direction: column;
            }

            .wishlist-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 15px;
            }

            .wishlist-image {
                height: 190px;
            }

        }


        @media (max-width: 480px) {

            .wishlist-grid {
                grid-template-columns: 1fr;
            }

            .wishlist-image {
                height: 240px;
            }

            .wishlist-header h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ===================================================== -->

    <nav class="navbar">

        <div class="logo">

            <a href="index.html">
                ShopSphere
            </a>

        </div>


        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#products">
                Shop
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#products">
                Deals
            </a>

        </div>


        <div class="nav-actions">

            <a href="wishlist.html"
                class="icon-btn active">

                <i class="fa-solid fa-heart"></i>

            </a>


            <a href="cart.html"
                class="icon-btn">

                <i class="fa-solid fa-bag-shopping"></i>

            </a>


            <a href="login.html"
                class="login-btn">

                Sign In

            </a>

        </div>

    </nav>


    <!-- =====================================================
         WISHLIST
    ===================================================== -->

    <main class="wishlist-page">


        <div class="wishlist-header">

            <span class="wishlist-label">
                SAVED FOR LATER
            </span>


            <div class="wishlist-header-row">

                <div>

                    <h1>
                        My Wishlist
                    </h1>

                    <p>
                        Products you've saved for later.
                    </p>

                </div>


                <div
                    class="wishlist-count"
                    id="wishlist-count">

                    Wishlist

                </div>

            </div>

        </div>


        <div
            id="wishlist-container">

            <div class="wishlist-loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <span>
                    Loading wishlist...
                </span>

            </div>

        </div>

    </main>


    <!-- =====================================================
         SCRIPT
    ===================================================== -->

    <script>

        const API_URL =
            "https://shopsphere-backend-4aji.onrender.com";


        // ==================================================
        // GET LOGGED-IN USER
        // ==================================================

        function getLoggedInUser() {

            const userData =
                localStorage.getItem(
                    "shopsphere_user"
                );


            if (!userData) {

                return null;

            }


            try {

                return JSON.parse(
                    userData
                );

            } catch (error) {

                console.error(
                    "Invalid user data:",
                    error
                );

                localStorage.removeItem(
                    "shopsphere_user"
                );

                return null;

            }

        }


        // ==================================================
        // LOAD WISHLIST
        // ==================================================

        async function loadWishlist() {

            const user =
                getLoggedInUser();


            if (!user) {

                alert(
                    "⚠️ Please sign in first."
                );

                window.location.href =
                    "login.html";

                return;

            }


            const container =
                document.getElementById(
                    "wishlist-container"
                );


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/wishlist/${user.user_id}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load wishlist"
                    );

                }


                const wishlist =
                    await response.json();


                displayWishlist(
                    wishlist,
                    container
                );


            } catch (error) {

                console.error(error);


                container.innerHTML = `

                    <div class="wishlist-error">

                        <i class="fa-solid fa-triangle-exclamation"></i>

                        <h3>
                            Unable to load wishlist
                        </h3>

                        <p>
                            Please try again later.
                        </p>

                    </div>

                `;

            }

        }


        // ==================================================
        // DISPLAY WISHLIST
        // ==================================================

        function displayWishlist(
            wishlist,
            container
        ) {

            const countElement =
                document.getElementById(
                    "wishlist-count"
                );


            const count =
                wishlist
                    ? wishlist.length
                    : 0;


            countElement.textContent =
                `${count} ${count === 1 ? "Item" : "Items"}`;


            if (
                !wishlist ||
                wishlist.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty-wishlist">

                        <div class="empty-wishlist-icon">

                            <i class="fa-regular fa-heart"></i>

                        </div>

                        <h3>
                            Your wishlist is empty
                        </h3>

                        <p>
                            Save products you love and
                            find them here whenever you're
                            ready to shop.
                        </p>

                        <a href="index.html#products">

                            <i class="fa-solid fa-bag-shopping"></i>

                            Start Shopping

                        </a>

                    </div>

                `;

                return;

            }


            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "wishlist-grid";


            wishlist.forEach(item => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "wishlist-card";


                const brand =
                    item.brand ||
                    "ShopSphere";


                const image =
                    item.image ||
                    item.product_image ||
                    "";


                card.innerHTML = `

                    <div class="wishlist-image">

                        ${
                            image
                            ?

                            `<img
                                src="${image}"
                                alt="${item.product_name}"
                                onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                            >`

                            :

                            ""
                        }


                        <div
                            class="wishlist-image-placeholder"
                            style="display:${image ? "none" : "flex"};"
                        >

                            <i class="fa-solid fa-box"></i>

                        </div>


                        <button
                            type="button"
                            class="wishlist-remove"
                            title="Remove from wishlist"
                            onclick="removeWishlist(${item.product_id})"
                        >

                            <i class="fa-solid fa-heart"></i>

                        </button>

                    </div>


                    <div class="wishlist-info">

                        <span class="wishlist-brand">

                            ${brand}

                        </span>


                        <h3>

                            ${item.product_name}

                        </h3>


                        <div class="wishlist-price">

                            ₹${Number(
                                item.price || 0
                            ).toLocaleString("en-IN")}

                        </div>

                    </div>


                    <div class="wishlist-actions">

                        <button
                            type="button"
                            class="wishlist-cart-btn"
                            onclick="addWishlistItemToCart(${item.product_id})"
                        >

                            <i class="fa-solid fa-cart-plus"></i>

                            Add to Cart

                        </button>


                        <button
                            type="button"
                            class="wishlist-delete-btn"
                            onclick="removeWishlist(${item.product_id})"
                        >

                            <i class="fa-solid fa-trash"></i>

                            Remove

                        </button>

                    </div>

                `;


                grid.appendChild(card);

            });


            container.innerHTML = "";

            container.appendChild(grid);

        }


        // ==================================================
        // ADD WISHLIST ITEM TO CART
        // ==================================================

        async function addWishlistItemToCart(
            productId
        ) {

            const user =
                getLoggedInUser();


            if (!user) {

                alert(
                    "⚠️ Please sign in first."
                );

                window.location.href =
                    "login.html";

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/cart/add`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                user_id:
                                    user.user_id,

                                product_id:
                                    Number(productId),

                                quantity: 1

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Could not add product to cart"
                    );

                }


                alert(
                    "✅ Product added to cart!"
                );


            } catch (error) {

                console.error(error);


                alert(
                    `❌ ${error.message}`
                );

            }

        }


        // ==================================================
        // REMOVE FROM WISHLIST
        // ==================================================

        async function removeWishlist(
            productId
        ) {

            const user =
                getLoggedInUser();


            if (!user) {

                alert(
                    "⚠️ Please sign in first."
                );

                window.location.href =
                    "login.html";

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/wishlist/${user.user_id}/${productId}`,
                        {
                            method: "DELETE"
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Could not remove product"
                    );

                }


                alert(
                    "❤️ Product removed from wishlist."
                );


                loadWishlist();


            } catch (error) {

                console.error(error);


                alert(
                    `❌ ${error.message}`
                );

            }

        }


        // ==================================================
        // LOAD PAGE
        // ==================================================

        document.addEventListener(
            "DOMContentLoaded",
            loadWishlist
        );

    </script>


</body>

</html>
