<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Your Cart</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">S</span>
            <span>Shop<span>Sphere</span></span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#products">Shop</a>
            <a href="#">Categories</a>
            <a href="#">Deals</a>
        </nav>

        <div class="nav-actions">

            <button class="icon-btn">
                <i class="fa-regular fa-heart"></i>
            </button>

            <button class="icon-btn active-cart">
                <i class="fa-solid fa-bag-shopping"></i>
            </button>

            <button class="login-btn">
                Sign In
            </button>

        </div>

    </header>


    <!-- CART -->

    <main class="cart-page">

        <div class="cart-header">

            <span class="section-label">SHOPPING CART</span>

            <h1>Your Cart</h1>

            <p>
                Review your items before continuing to checkout.
            </p>

        </div>


        <div class="cart-layout">

            <!-- CART ITEMS -->

            <section class="cart-items-section">

                <div id="cart-items">

                    <div class="cart-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Loading your cart...
                    </div>

                </div>

            </section>


            <!-- ORDER SUMMARY -->

            <aside class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Items</span>
                    <span id="item-count">0</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span class="free">FREE</span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-total">
                    <span>Total</span>
                    <strong id="cart-total">₹0</strong>
                </div>

                <a href="checkout.html" class="checkout-btn"></a>
                    Proceed to Checkout
                    <i class="fa-solid fa-arrow-right"></i>
                </a>

                <a href="index.html" class="continue-shopping">
                    <i class="fa-solid fa-arrow-left"></i>
                    Continue Shopping
                </a>

            </aside>

        </div>

    </main>


    <footer>

        <div class="footer-bottom">
            <span>© 2026 ShopSphere</span>
            <span>Built with HTML • CSS • JavaScript • MySQL</span>
        </div>

    </footer>


    <script src="cart.js"></script>

</body>

</html>
